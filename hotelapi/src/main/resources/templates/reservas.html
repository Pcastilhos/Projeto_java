<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Reservas</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header>
        <a href="/">Início</a>
        <a href="/tela/hoteis">Hotéis</a>
        <a href="/tela/quartos">Quartos</a>
        <a href="/tela/hospedes">Hóspedes</a>
        <a href="/tela/funcionarios">Funcionários</a>
        <a href="/tela/servicos">Serviços</a>
        <a href="/tela/reservas">Reservas</a>
    </header>

    <main class="container">

        <h1>Reservas</h1>

        {{MENSAGEM}}

        <section class="card">
            <h2>Nova reserva</h2>

            <!-- primeiro busca os quartos livres no período -->
            <form method="get" action="/tela/reservas">
                <div class="formulario">
                    <label>Hóspede</label>
                    <select name="hospedeId">{{OPCOES_HOSPEDES}}</select>

                    <label>Hotel</label>
                    <select name="hotelId">{{OPCOES_HOTEIS}}</select>

                    <label>Data de entrada</label>
                    <input type="date" name="entrada" value="{{ENTRADA}}">

                    <label>Data de saída</label>
                    <input type="date" name="saida" value="{{SAIDA}}">

                    <label>Quantidade de hóspedes</label>
                    <input type="number" name="quantidade" value="{{QUANTIDADE}}">
                </div>

                <p><button type="submit">Buscar quartos disponíveis</button></p>
            </form>

            {{DISPONIVEIS}}
        </section>

        <section class="card">
            <h2>Reservas cadastradas</h2>
            <p>Ciclo: PENDENTE → CONFIRMADA → EM_ANDAMENTO (check-in) → FINALIZADA (check-out). Pendentes e confirmadas podem ser canceladas.</p>
            {{LISTA}}
        </section>

    </main>

</body>

</html>
